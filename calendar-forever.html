<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose Our Date</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        background: linear-gradient(180deg, #fff2f7 0%, #ffd8ec 45%, #ffc2df 100%);
        min-height: 100vh;
        overflow-x: hidden;
        padding: 24px 0 40px;
      }

      .heart-field {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }

      .heart {
        position: absolute;
        top: -20%;
        font-size: 1.1rem;
        color: rgba(255, 122, 184, 0.8);
        text-shadow: 0 0 12px rgba(255, 146, 206, 0.7);
        animation: floatHeart linear forwards;
        opacity: 0;
      }

      @keyframes floatHeart {
        0% {
          transform: translate3d(0, 0, 0) scale(0.6) rotate(0deg);
          opacity: 0;
        }
        15% {
          opacity: 0.9;
        }
        100% {
          transform: translate3d(var(--drift), 120vh, 0) scale(1.3) rotate(18deg);
          opacity: 0;
        }
      }

      .calendar-shell {
        position: relative;
        z-index: 1;
        width: min(92vw, 980px);
        padding: 28px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.45);
        border: 2px solid rgba(255,255,255,0.7);
        box-shadow: 0 18px 36px rgba(255, 118, 177, 0.18);
        backdrop-filter: blur(10px);
      }

      .calendar-top {
        text-align: center;
        margin-bottom: 20px;
      }

      .calendar-top h2 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3rem);
        color: #ff4ea6;
        line-height: 1.15;
      }

      .calendar-top p {
        margin: 10px auto 0;
        max-width: 660px;
        font-size: 1.15rem;
        color: #7a335c;
      }

      .time-picker-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin: 18px auto 0;
        flex-wrap: wrap;
      }

      .time-label {
        font-size: 1rem;
        font-weight: 900;
        color: #7a335c;
      }

      .time-picker {
        padding: 12px 16px;
        border: 2px solid rgba(255, 107, 176, 0.4);
        border-radius: 14px;
        background: rgba(255,255,255,0.7);
        color: #7a335c;
        font-size: 1rem;
        font-weight: 800;
      }

      .month-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 18px 0 20px;
      }

      .month-nav-btn {
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 50%;
        background: rgba(255,255,255,0.72);
        color: #ff4ea6;
        font-size: 1.5rem;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 8px 16px rgba(255, 120, 180, 0.18);
      }

      .month-label {
        flex: 1;
        text-align: center;
        font-size: clamp(1.2rem, 2vw, 1.8rem);
        font-weight: 900;
        color: #8a325f;
      }

      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(52px, 1fr));
        gap: 12px;
        margin-top: 20px;
      }

      .day-name {
        text-align: center;
        font-size: 0.9rem;
        font-weight: 800;
        color: #8f3f6d;
        opacity: 0.8;
      }

      .day {
        border: none;
        min-height: 64px;
        border-radius: 18px;
        background: rgba(255,255,255,0.58);
        color: #7d355f;
        font-size: 1rem;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }

      .day:hover {
        transform: translateY(-2px);
        background: rgba(255, 207, 230, 0.9);
        box-shadow: 0 8px 18px rgba(255, 119, 179, 0.18);
      }

      .day.empty {
        background: transparent;
        box-shadow: none;
        cursor: default;
      }

      .day.selected {
        background: linear-gradient(135deg, #ff83c4, #ff4ea6);
        color: white;
        box-shadow: 0 10px 20px rgba(255, 94, 168, 0.3);
      }

    </style>
  </head>
  <body>
    <div class="heart-field" aria-hidden="true"></div>

    <main class="calendar-shell">
      <div class="calendar-top">
        <h2>Choose the date for the best date in your entire life.</h2>
        <p>Pick the day you want us to make unforgettable.</p>
      </div>

      <div class="time-picker-wrap">
        <label class="time-label" for="timePicker">Choose a time:</label>
        <select id="timePicker" class="time-picker">
          <option value="7:00 PM">7:00 PM</option>
          <option value="7:30 PM">7:30 PM</option>
          <option value="8:00 PM" selected>8:00 PM</option>
          <option value="8:30 PM">8:30 PM</option>
          <option value="9:00 PM">9:00 PM</option>
          <option value="9:30 PM">9:30 PM</option>
          <option value="10:00 PM">10:00 PM</option>
        </select>
      </div>

      <div class="month-bar" aria-label="Choose month">
        <button type="button" class="month-nav-btn" id="prevMonth" aria-label="Previous month">←</button>
        <div class="month-label" id="monthLabel">October 2026</div>
        <button type="button" class="month-nav-btn" id="nextMonth" aria-label="Next month">→</button>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>

    </main>

    <script>
      const calendarGrid = document.getElementById('calendarGrid');
      const monthLabel = document.getElementById('monthLabel');
      const prevMonthBtn = document.getElementById('prevMonth');
      const nextMonthBtn = document.getElementById('nextMonth');
      const timePicker = document.getElementById('timePicker');
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      const startMonth = new Date(2026, 9, 1);
      let currentMonthDate = new Date(startMonth.getFullYear(), startMonth.getMonth(), 1);

      function renderMonth() {
        const month = currentMonthDate.getMonth();
        const year = currentMonthDate.getFullYear();
        const monthStart = new Date(year, month, 1);
        const monthEnd = new Date(year, month + 1, 0);
        const firstDayIndex = monthStart.getDay();
        const totalDays = monthEnd.getDate();

        calendarGrid.innerHTML = '';
        monthLabel.textContent = `${monthStart.toLocaleString('en-US', { month: 'long' })} ${year}`;

        days.forEach((day) => {
          const cell = document.createElement('div');
          cell.className = 'day-name';
          cell.textContent = day;
          calendarGrid.appendChild(cell);
        });

        for (let i = 0; i < firstDayIndex; i += 1) {
          const empty = document.createElement('button');
          empty.type = 'button';
          empty.className = 'day empty';
          empty.disabled = true;
          calendarGrid.appendChild(empty);
        }

        for (let day = 1; day <= totalDays; day += 1) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'day';
          btn.textContent = day;

          btn.addEventListener('click', () => {
            document.querySelectorAll('.day:not(.empty)').forEach((d) => d.classList.remove('selected'));
            btn.classList.add('selected');

            const selectedDate = new Date(year, month, day);
            localStorage.setItem('selectedDate', selectedDate.toISOString());
            localStorage.setItem('selectedTime', timePicker.value);
            window.location.href = 'restaurant.html';
          });

          calendarGrid.appendChild(btn);
        }
      }

      prevMonthBtn.addEventListener('click', () => {
        const nextMonth = new Date(currentMonthDate.getFullYear(), currentMonthDate.getMonth() - 1, 1);
        if (nextMonth < startMonth) {
          return;
        }

        currentMonthDate = nextMonth;
        renderMonth();
      });

      nextMonthBtn.addEventListener('click', () => {
        currentMonthDate = new Date(currentMonthDate.getFullYear(), currentMonthDate.getMonth() + 1, 1);
        renderMonth();
      });

      const heartField = document.querySelector('.heart-field');
      function createHeart() {
        if (!heartField) return;
        const heart = document.createElement('span');
        const symbols = ['❤', '♥', '♡'];
        heart.className = 'heart';
        heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.animationDuration = `${8 + Math.random() * 7}s`;
        heart.style.fontSize = `${0.9 + Math.random() * 1.7}rem`;
        heart.style.setProperty('--drift', `${(Math.random() - 0.5) * 180}px`);
        heartField.appendChild(heart);
        setTimeout(() => heart.remove(), 15000);
      }

      renderMonth();

      for (let i = 0; i < 18; i += 1) {
        setTimeout(createHeart, i * 260);
      }

      setInterval(createHeart, 500);
    </script>
  </body>
</html>
