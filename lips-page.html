<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lips</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        background: linear-gradient(180deg, #fff7f0 0%, #ffe2ee 32%, #ffd7ea 100%);
        min-height: 100vh;
        overflow-x: hidden;
        padding: 32px 0 40px;
      }

      .heart-field {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }

      .heart {
        position: absolute;
        top: -20%;
        font-size: 1.1rem;
        color: rgba(255, 122, 184, 0.82);
        text-shadow: 0 0 12px rgba(255, 146, 206, 0.7);
        animation: floatHeart linear forwards;
        opacity: 0;
      }

      .kiss-pop {
        position: absolute;
        top: 50%;
        left: 50%;
        font-size: 1.8rem;
        color: rgba(255, 116, 180, 0.9);
        text-shadow: 0 0 12px rgba(255, 146, 206, 0.7);
        animation: kissFloat 2.2s ease-out forwards;
        opacity: 0;
        pointer-events: none;
      }

      @keyframes floatHeart {
        0% {
          transform: translate3d(0, 0, 0) scale(0.6) rotate(0deg);
          opacity: 0;
        }
        15% {
          opacity: 0.9;
        }
        100% {
          transform: translate3d(var(--drift), 110vh, 0) scale(1.3) rotate(18deg);
          opacity: 0;
        }
      }

      @keyframes kissFloat {
        0% {
          opacity: 0;
          transform: translate(-50%, 0) scale(0.8) rotate(0deg);
        }
        15% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(
            calc(-50% + var(--kiss-x, 0px)),
            calc(-20px + var(--kiss-y, -30px))
          ) scale(1.4) rotate(12deg);
        }
      }

      .compliment-card {
        position: relative;
        z-index: 1;
        width: min(92vw, 820px);
        margin: 0 auto;
        padding: 32px 24px 28px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.46);
        border: 2px solid rgba(255,255,255,0.75);
        box-shadow: 0 18px 36px rgba(255, 118, 177, 0.18);
        text-align: center;
      }

      .compliment-card h1 {
        margin: 0 0 18px;
        font-size: clamp(2.2rem, 4vw, 4rem);
        line-height: 1.1;
        color: #ff4ea6;
      }

      .compliment-card p {
        margin: 0 auto;
        max-width: 700px;
        font-size: clamp(1.1rem, 2vw, 1.5rem);
        line-height: 1.7;
        color: #7a335c;
      }

      .back-btn {
        display: inline-block;
        margin-top: 26px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, #ff7ec1 0%, #ff4f9c 42%, #ff7ab8 100%);
        color: white;
        padding: 14px 22px;
        font-size: 1rem;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 14px 24px rgba(255, 92, 167, 0.28);
      }
    </style>
  </head>
  <body>
    <div class="heart-field" aria-hidden="true"></div>

    <main class="compliment-card">
      <h1>Lips</h1>
      <p>
        Forget about five-star restaurants. One look at those gorgeous, perfect lips of yours, and I'm convinced
        they're the only delicacy I'd ever need. I could genuinely skip eating forever if you were the only thing on the menu.
      </p>

      <button class="back-btn" type="button">Back to compliments</button>
    </main>

    <script>
      const heartField = document.querySelector('.heart-field');
      const backBtn = document.querySelector('.back-btn');

      backBtn.addEventListener('click', () => {
        window.location.href = 'compliments-page.html';
      });

      function createHeart() {
        if (!heartField) return;
        const heart = document.createElement('span');
        const symbols = ['❤', '♥', '♡'];
        heart.className = 'heart';
        heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.animationDuration = `${8 + Math.random() * 7}s`;
        heart.style.fontSize = `${0.9 + Math.random() * 1.8}rem`;
        heart.style.setProperty('--drift', `${(Math.random() - 0.5) * 180}px`);
        heartField.appendChild(heart);
        setTimeout(() => heart.remove(), 15000);
      }

      function createKissPop() {
        const kiss = document.createElement('span');
        kiss.className = 'kiss-pop';
        kiss.textContent = '💋';
        kiss.style.left = `${20 + Math.random() * 60}%`;
        kiss.style.top = `${18 + Math.random() * 60}%`;
        kiss.style.setProperty('--kiss-x', `${(Math.random() - 0.5) * 140}px`);
        kiss.style.setProperty('--kiss-y', `${(Math.random() - 0.5) * 120}px`);
        document.body.appendChild(kiss);
        setTimeout(() => kiss.remove(), 2200);
      }

      for (let i = 0; i < 18; i += 1) {
        setTimeout(createHeart, i * 260);
      }

      for (let i = 0; i < 9; i += 1) {
        setTimeout(createKissPop, i * 500);
      }

      setInterval(createHeart, 500);
      setInterval(createKissPop, 1800);
    </script>
  </body>
</html>
