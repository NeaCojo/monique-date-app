<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        background: linear-gradient(180deg, #fffaf6 0%, #f7d8ff 30%, #edb1ff 100%);
        min-height: 100vh;
        overflow-x: hidden;
        padding: 32px 0 40px;
      }

      .heart-field {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }

      .heart {
        position: absolute;
        top: -20%;
        font-size: 1.1rem;
        color: rgba(172, 102, 255, 0.8);
        text-shadow: 0 0 12px rgba(196, 129, 255, 0.7);
        animation: floatHeart linear forwards;
        opacity: 0;
      }

      .feet-pop {
        position: absolute;
        top: 50%;
        left: 50%;
        font-size: 2.2rem;
        color: rgba(153, 102, 255, 0.9);
        text-shadow: 0 0 12px rgba(180, 129, 255, 0.7);
        animation: feetFloat 2.5s ease-out forwards;
        opacity: 0;
        pointer-events: none;
      }

      @keyframes floatHeart {
        0% {
          transform: translate3d(0, 0, 0) scale(0.6) rotate(0deg);
          opacity: 0;
        }
        15% {
          opacity: 0.9;
        }
        100% {
          transform: translate3d(var(--drift), 110vh, 0) scale(1.3) rotate(18deg);
          opacity: 0;
        }
      }

      @keyframes feetFloat {
        0% {
          opacity: 0;
          transform: translate(-50%, 0) scale(0.75) rotate(0deg);
        }
        15% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(
            calc(-50% + var(--feet-x, 0px)),
            calc(-40px + var(--feet-y, -18px))
          ) scale(1.45) rotate(15deg);
        }
      }

      .compliment-card {
        position: relative;
        z-index: 1;
        width: min(92vw, 820px);
        margin: 0 auto;
        padding: 32px 24px 28px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.42);
        border: 2px solid rgba(255,255,255,0.7);
        box-shadow: 0 18px 36px rgba(154, 90, 255, 0.18);
        text-align: center;
      }

      .compliment-card h1 {
        margin: 0 0 18px;
        font-size: clamp(2.2rem, 4vw, 4rem);
        line-height: 1.1;
        color: #8f4dff;
      }

      .compliment-card p {
        margin: 0 auto;
        max-width: 720px;
        font-size: clamp(1.2rem, 2.4vw, 1.7rem);
        line-height: 1.7;
        color: #4a2670;
        font-weight: 800;
      }

      .back-btn {
        display: inline-block;
        margin-top: 26px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, #b98cff 0%, #8f4dff 42%, #d79cff 100%);
        color: white;
        padding: 14px 22px;
        font-size: 1rem;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 14px 24px rgba(143, 77, 255, 0.28);
      }
    </style>
  </head>
  <body>
    <div class="heart-field" aria-hidden="true"></div>

    <main class="compliment-card">
      <h1>MY FAVORITE FEET</h1>
      <p>
        I HAVE BEEN TO PARADISE GUYS!!!!!!!!!!
      </p>

      <button class="back-btn" type="button">Back to compliments</button>
    </main>

    <script>
      const heartField = document.querySelector('.heart-field');
      const backBtn = document.querySelector('.back-btn');

      backBtn.addEventListener('click', () => {
        window.location.href = 'compliments-page.html';
      });

      function createHeart() {
        if (!heartField) return;
        const heart = document.createElement('span');
        const symbols = ['❤', '♥', '♡'];
        heart.className = 'heart';
        heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.animationDuration = `${8 + Math.random() * 7}s`;
        heart.style.fontSize = `${0.9 + Math.random() * 1.8}rem`;
        heart.style.setProperty('--drift', `${(Math.random() - 0.5) * 180}px`);
        heartField.appendChild(heart);
        setTimeout(() => heart.remove(), 15000);
      }

      function createFeetPop() {
        const feet = document.createElement('span');
        feet.className = 'feet-pop';
        const emojis = ['👣', '✨', '💫', '🌸'];
        feet.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        feet.style.left = `${20 + Math.random() * 60}%`;
        feet.style.top = `${18 + Math.random() * 62}%`;
        feet.style.setProperty('--feet-x', `${(Math.random() - 0.5) * 160}px`);
        feet.style.setProperty('--feet-y', `${(Math.random() - 0.5) * 150}px`);
        document.body.appendChild(feet);
        setTimeout(() => feet.remove(), 2600);
      }

      for (let i = 0; i < 18; i += 1) {
        setTimeout(createHeart, i * 260);
      }

      for (let i = 0; i < 10; i += 1) {
        setTimeout(createFeetPop, i * 420);
      }

      setInterval(createHeart, 520);
      setInterval(createFeetPop, 1800);
    </script>
  </body>
</html>
