<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        background: linear-gradient(180deg, #fffaf7 0%, #ffe6ed 40%, #ffd9ea 100%);
        min-height: 100vh;
        padding: 32px 20px 48px;
        overflow-x: hidden;
      }

      .heart-field {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }

      .heart {
        position: absolute;
        top: -20%;
        font-size: 1.1rem;
        color: rgba(255, 119, 180, 0.85);
        text-shadow: 0 0 12px rgba(255, 154, 206, 0.75);
        animation: floatHeart linear forwards;
        opacity: 0;
      }

      @keyframes floatHeart {
        0% {
          transform: translate3d(0, 0, 0) scale(0.6) rotate(0deg);
          opacity: 0;
        }
        15% {
          opacity: 0.9;
        }
        100% {
          transform: translate3d(var(--drift), 120vh, 0) scale(1.3) rotate(18deg);
          opacity: 0;
        }
      }

      .page-shell {
        position: relative;
        z-index: 1;
        width: min(92vw, 860px);
        margin: 0 auto;
        padding: 34px 24px 40px;
        background: rgba(255,255,255,0.54);
        border: 2px solid rgba(255,255,255,0.8);
        border-radius: 30px;
        box-shadow: 0 18px 34px rgba(255, 118, 177, 0.15);
        text-align: center;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(2.2rem, 4vw, 4rem);
        color: #ff4ea6;
      }

      .detail-card {
        max-width: 660px;
        margin: 0 auto;
        padding: 22px 18px;
        border-radius: 24px;
        background: rgba(255,255,255,0.56);
        border: 1px solid rgba(255,255,255,0.7);
      }

      .detail-card p {
        margin: 12px 0;
        font-size: clamp(1.05rem, 2vw, 1.35rem);
        line-height: 1.7;
        color: #6f2c4c;
        font-weight: 700;
      }

      .love-line {
        margin-top: 24px;
        font-size: clamp(1.15rem, 2vw, 1.6rem);
        line-height: 1.8;
        color: #8b2b5a;
        font-weight: 800;
      }

      .actions {
        margin-top: 28px;
        display: flex;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .back-btn,
      .mail-btn {
        display: inline-block;
        padding: 16px 24px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, #ff7ec1 0%, #ff4f9c 48%, #ff8ac0 100%);
        color: white;
        font-size: 1rem;
        font-weight: 900;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 14px 24px rgba(255, 92, 167, 0.28);
      }

      .mail-btn {
        background: linear-gradient(135deg, #ffc7e6 0%, #ff9ec8 100%);
      }
    </style>
  </head>
  <body>
    <div class="heart-field" aria-hidden="true"></div>

    <main class="page-shell">
      <h1>Our date</h1>

      <div class="detail-card">
        <p><strong>Location:</strong> <span id="restaurantName">Selected restaurant</span></p>
        <p><strong>Date:</strong> <span id="selectedDate">Not set</span></p>
        <p><strong>Time:</strong> <span id="selectedTime">Not set</span></p>

        <div class="love-line" id="loveMessage">
          I love you<br />
          Te iubesc<br />
          Ich liebe dich<br />
          Je t'aime<br />
          Ti amo<br />
          Aku mengasihi kamu<br />
          I love you more every day
        </div>
      </div>

      <div class="actions">
        <button class="mail-btn" type="button">Send date by email</button>
        <button class="back-btn" type="button">Back to restaurants</button>
      </div>
    </main>

    <script>
      const heartField = document.querySelector('.heart-field');
      const backBtn = document.querySelector('.back-btn');
      const mailBtn = document.querySelector('.mail-btn');
      const restaurantName = document.getElementById('restaurantName');
      const selectedDate = document.getElementById('selectedDate');
      const selectedTime = document.getElementById('selectedTime');

      let savedRestaurant = 'Selected restaurant';
      let savedDateText = 'Not set';
      let savedTimeText = 'Not set';

      try {
        savedRestaurant = localStorage.getItem('selectedRestaurant') || 'Selected restaurant';
        const savedDate = localStorage.getItem('selectedDate');
        savedTimeText = localStorage.getItem('selectedTime') || '8:00 PM';

        restaurantName.textContent = savedRestaurant;

        if (savedDate) {
          const dateObj = new Date(savedDate);
          savedDateText = dateObj.toLocaleDateString('en-US', {
            month: 'long',
            day: 'numeric',
            year: 'numeric'
          });
          selectedDate.textContent = savedDateText;
        }

        selectedTime.textContent = savedTimeText;
      } catch (error) {
        restaurantName.textContent = 'Selected restaurant';
        selectedDate.textContent = 'Not set';
        selectedTime.textContent = 'Not set';
      }

      const emailBody = `Restaurant: ${savedRestaurant}\nDate: ${savedDateText}\nTime: ${savedTimeText}`;

      mailBtn.addEventListener('click', async () => {
        try {
          const response = await fetch('/send-email', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              restaurant: savedRestaurant,
              date: savedDateText,
              time: savedTimeText,
              message: ''
            })
          });

          const result = await response.json();

          if (!response.ok || !result.ok) {
            const mailtoLink = `mailto:mihaicojocaru962@gmail.com?subject=${encodeURIComponent('Date plan for Monique')}&body=${encodeURIComponent(emailBody)}`;
            window.location.href = mailtoLink;
            return;
          }

          alert('Email sent successfully.');
        } catch (error) {
          const mailtoLink = `mailto:mihaicojocaru962@gmail.com?subject=${encodeURIComponent('Date plan for Monique')}&body=${encodeURIComponent(emailBody)}`;
          window.location.href = mailtoLink;
        }
      });

      backBtn.addEventListener('click', () => {
        window.location.href = 'restaurant.html';
      });

      function createHeart() {
        if (!heartField) return;
        const heart = document.createElement('span');
        const symbols = ['❤', '♥', '♡'];
        heart.className = 'heart';
        heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.animationDuration = `${8 + Math.random() * 7}s`;
        heart.style.fontSize = `${0.9 + Math.random() * 1.8}rem`;
        heart.style.setProperty('--drift', `${(Math.random() - 0.5) * 180}px`);
        heartField.appendChild(heart);
        setTimeout(() => heart.remove(), 16000);
      }

      for (let i = 0; i < 20; i += 1) {
        setTimeout(createHeart, i * 220);
      }

      setInterval(createHeart, 500);
    </script>
  </body>
</html>
