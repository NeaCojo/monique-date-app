<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>7th Option</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        background: linear-gradient(180deg, #fff7f4 0%, #ffe0e6 40%, #ffd4ec 100%);
        min-height: 100vh;
        padding: 32px 20px 48px;
        overflow-x: hidden;
      }

      .heart-field {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }

      .heart {
        position: absolute;
        top: -20%;
        font-size: 1.1rem;
        color: rgba(255, 120, 180, 0.85);
        text-shadow: 0 0 12px rgba(255, 154, 206, 0.75);
        animation: floatHeart linear forwards;
        opacity: 0;
      }

      @keyframes floatHeart {
        0% {
          transform: translate3d(0, 0, 0) scale(0.6) rotate(0deg);
          opacity: 0;
        }
        15% {
          opacity: 0.9;
        }
        100% {
          transform: translate3d(var(--drift), 120vh, 0) scale(1.3) rotate(18deg);
          opacity: 0;
        }
      }

      .page-shell {
        position: relative;
        z-index: 1;
        width: min(90vw, 760px);
        margin: 0 auto;
        padding: 36px 24px 40px;
        background: rgba(255,255,255,0.54);
        border: 2px solid rgba(255,255,255,0.8);
        border-radius: 30px;
        box-shadow: 0 18px 34px rgba(255, 118, 177, 0.15);
        text-align: center;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(2rem, 4vw, 3.2rem);
        color: #ff4ea6;
      }

      .message {
        margin: 0 auto 24px;
        max-width: 560px;
        font-size: clamp(1.2rem, 2.3vw, 1.7rem);
        line-height: 1.7;
        color: #7a355d;
        font-weight: 800;
      }

      .back-btn {
        display: inline-block;
        padding: 16px 24px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, #ff7ec1 0%, #ff4f9c 48%, #ff8ac0 100%);
        color: white;
        font-size: 1rem;
        font-weight: 900;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 14px 24px rgba(255, 92, 167, 0.28);
      }
    </style>
  </head>
  <body>
    <div class="heart-field" aria-hidden="true"></div>

    <main class="page-shell">
      <h1>Hmm...</h1>
      <p class="message">So you are very freaky honey I see.</p>
      <button class="back-btn" type="button">Go back to restaurants</button>
    </main>

    <script>
      const heartField = document.querySelector('.heart-field');
      const backBtn = document.querySelector('.back-btn');

      backBtn.addEventListener('click', () => {
        window.location.href = 'restaurant.html';
      });

      function createHeart() {
        if (!heartField) return;
        const heart = document.createElement('span');
        const symbols = ['❤', '♥', '♡'];
        heart.className = 'heart';
        heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.animationDuration = `${8 + Math.random() * 7}s`;
        heart.style.fontSize = `${0.9 + Math.random() * 1.8}rem`;
        heart.style.setProperty('--drift', `${(Math.random() - 0.5) * 180}px`);
        heartField.appendChild(heart);
        setTimeout(() => heart.remove(), 16000);
      }

      for (let i = 0; i < 18; i += 1) {
        setTimeout(createHeart, i * 220);
      }

      setInterval(createHeart, 500);
    </script>
  </body>
</html>
