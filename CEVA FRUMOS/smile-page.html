<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        background: linear-gradient(180deg, #fffef8 0%, #fff2cc 32%, #ffe7b8 100%);
        min-height: 100vh;
        overflow-x: hidden;
        padding: 32px 0 40px;
      }

      .heart-field {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }

      .heart {
        position: absolute;
        top: -20%;
        font-size: 1.1rem;
        color: rgba(255, 182, 71, 0.8);
        text-shadow: 0 0 12px rgba(255, 196, 107, 0.7);
        animation: floatHeart linear forwards;
        opacity: 0;
      }

      .smile-pop {
        position: absolute;
        top: 50%;
        left: 50%;
        font-size: 2rem;
        color: rgba(255, 166, 0, 0.9);
        text-shadow: 0 0 10px rgba(255, 189, 81, 0.6);
        animation: smileFloat 2.5s ease-out forwards;
        opacity: 0;
        pointer-events: none;
      }

      @keyframes floatHeart {
        0% {
          transform: translate3d(0, 0, 0) scale(0.6) rotate(0deg);
          opacity: 0;
        }
        15% {
          opacity: 0.9;
        }
        100% {
          transform: translate3d(var(--drift), 110vh, 0) scale(1.3) rotate(20deg);
          opacity: 0;
        }
      }

      @keyframes smileFloat {
        0% {
          opacity: 0;
          transform: translate(-50%, 0) scale(0.75) rotate(0deg);
        }
        15% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(
            calc(-50% + var(--smile-x, 0px)),
            calc(-40px + var(--smile-y, -20px))
          ) scale(1.45) rotate(12deg);
        }
      }

      .compliment-card {
        position: relative;
        z-index: 1;
        width: min(92vw, 840px);
        margin: 0 auto;
        padding: 32px 24px 28px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.42);
        border: 2px solid rgba(255,255,255,0.7);
        box-shadow: 0 18px 36px rgba(255, 176, 72, 0.18);
        text-align: center;
      }

      .compliment-card h1 {
        margin: 0 0 18px;
        font-size: clamp(2.2rem, 4vw, 4rem);
        line-height: 1.1;
        color: #ff9d1a;
      }

      .compliment-card p {
        margin: 0 auto;
        max-width: 720px;
        font-size: clamp(1.1rem, 2vw, 1.5rem);
        line-height: 1.75;
        color: #6d4b14;
      }

      .back-btn {
        display: inline-block;
        margin-top: 26px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, #ffbf5e 0%, #ff9d1a 42%, #ffc95d 100%);
        color: white;
        padding: 14px 22px;
        font-size: 1rem;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 14px 24px rgba(255, 159, 47, 0.26);
      }
    </style>
  </head>
  <body>
    <div class="heart-field" aria-hidden="true"></div>

    <main class="compliment-card">
      <h1>Smile</h1>
      <p>
        I don't need a lot of words to describe your smile—I’ll just say it brings me pure happiness.
        It’s actually incredible how fast my bad days and problems just fade away the second I see you smile.
      </p>

      <button class="back-btn" type="button">Back to compliments</button>
    </main>

    <script>
      const heartField = document.querySelector('.heart-field');
      const backBtn = document.querySelector('.back-btn');

      backBtn.addEventListener('click', () => {
        window.location.href = 'compliments-page.html';
      });

      function createHeart() {
        if (!heartField) return;
        const heart = document.createElement('span');
        const symbols = ['❤', '♥', '♡'];
        heart.className = 'heart';
        heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.animationDuration = `${8 + Math.random() * 7}s`;
        heart.style.fontSize = `${0.9 + Math.random() * 1.8}rem`;
        heart.style.setProperty('--drift', `${(Math.random() - 0.5) * 180}px`);
        heartField.appendChild(heart);
        setTimeout(() => heart.remove(), 15000);
      }

      function createSmilePop() {
        const smile = document.createElement('span');
        smile.className = 'smile-pop';
        const emojis = ['😊', '😄', '✨', '☀️'];
        smile.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        smile.style.left = `${20 + Math.random() * 60}%`;
        smile.style.top = `${18 + Math.random() * 60}%`;
        smile.style.setProperty('--smile-x', `${(Math.random() - 0.5) * 150}px`);
        smile.style.setProperty('--smile-y', `${(Math.random() - 0.5) * 140}px`);
        document.body.appendChild(smile);
        setTimeout(() => smile.remove(), 2600);
      }

      for (let i = 0; i < 18; i += 1) {
        setTimeout(createHeart, i * 260);
      }

      for (let i = 0; i < 10; i += 1) {
        setTimeout(createSmilePop, i * 420);
      }

      setInterval(createHeart, 500);
      setInterval(createSmilePop, 1800);
    </script>
  </body>
</html>
