<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One More Thing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        background: linear-gradient(180deg, #ffeaf5 0%, #ffcfe6 100%);
      }

      .heart-field {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }

      .heart {
        position: absolute;
        top: -20%;
        font-size: 1.1rem;
        color: rgba(255, 122, 184, 0.8);
        text-shadow: 0 0 12px rgba(255, 146, 206, 0.7);
        animation: floatHeart linear forwards;
        opacity: 0;
      }

      @keyframes floatHeart {
        0% {
          transform: translate3d(0, 0, 0) scale(0.6) rotate(0deg);
          opacity: 0;
        }
        15% {
          opacity: 0.9;
        }
        100% {
          transform: translate3d(var(--drift), 110vh, 0) scale(1.3) rotate(18deg);
          opacity: 0;
        }
      }

      .final-card {
        position: relative;
        z-index: 1;
        width: min(92vw, 760px);
        padding: 36px 28px;
        border-radius: 30px;
        background: rgba(255,255,255,0.45);
        border: 2px solid rgba(255,255,255,0.7);
        box-shadow: 0 18px 36px rgba(255, 118, 177, 0.18);
        text-align: center;
      }

      .final-card h1 {
        margin: 0;
        font-size: clamp(2.2rem, 4vw, 4rem);
        line-height: 1.1;
        color: #ff4ea6;
      }

      .final-card p {
        margin-top: 18px;
        font-size: 1.2rem;
        line-height: 1.6;
        color: #7a335c;
      }

      .cta-row {
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 24px;
      }

      .cta-btn {
        border: none;
        padding: 16px 22px;
        border-radius: 18px;
        font-size: 1rem;
        font-weight: 900;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .cta-btn:hover:not(:disabled) {
        transform: translateY(-2px);
      }

      .cta-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        filter: grayscale(0.16);
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.2);
      }

      .scared {
        background: linear-gradient(135deg, #ffb0d7, #ff7fc0);
        color: white;
        box-shadow: 0 12px 22px rgba(255, 129, 190, 0.28);
      }

      .excited {
        background: linear-gradient(135deg, #ff7ec1, #ff4ea6);
        color: white;
        box-shadow: 0 12px 22px rgba(255, 78, 166, 0.28);
      }
    </style>
  </head>
  <body>
    <div class="heart-field" aria-hidden="true"></div>

    <main class="final-card">
      <h1>ok ok wait...</h1>
      <p>I already know you will say this so just press the button.</p>

      <div class="cta-row">
        <button class="cta-btn scared" type="button">I'M REALLY SCARED TO PRESS THIS</button>
        <button class="cta-btn excited" type="button">THIS IS SO EXCITING</button>
      </div>
    </main>

    <script>
      const heartField = document.querySelector('.heart-field');
      const scaredBtn = document.querySelector('.scared');
      const excitedBtn = document.querySelector('.excited');

      scaredBtn.addEventListener('click', () => {
        window.location.href = 'knight-page.html';
      });

      excitedBtn.disabled = true;
      excitedBtn.setAttribute('aria-disabled', 'true');
      excitedBtn.title = 'Locked for now 💖';

      function createHeart() {
        if (!heartField) return;
        const heart = document.createElement('span');
        const symbols = ['❤', '♥', '♡'];
        heart.className = 'heart';
        heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.animationDuration = `${8 + Math.random() * 7}s`;
        heart.style.fontSize = `${0.9 + Math.random() * 1.7}rem`;
        heart.style.setProperty('--drift', `${(Math.random() - 0.5) * 180}px`);
        heartField.appendChild(heart);
        setTimeout(() => heart.remove(), 15000);
      }

      for (let i = 0; i < 22; i += 1) {
        setTimeout(createHeart, i * 260);
      }

      setInterval(createHeart, 500);
    </script>
  </body>
</html>
