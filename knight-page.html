<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Knight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        background: linear-gradient(180deg, #fff1f8 0%, #fbd7ec 100%);
        min-height: 100vh;
        overflow-x: hidden;
        padding: 24px 0 40px;
      }

      .heart-field {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }

      .heart {
        position: absolute;
        top: -20%;
        font-size: 1.1rem;
        color: rgba(255, 122, 184, 0.8);
        text-shadow: 0 0 12px rgba(255, 146, 206, 0.7);
        animation: floatHeart linear forwards;
        opacity: 0;
      }

      @keyframes floatHeart {
        0% {
          transform: translate3d(0, 0, 0) scale(0.6) rotate(0deg);
          opacity: 0;
        }
        15% {
          opacity: 0.9;
        }
        100% {
          transform: translate3d(var(--drift), 110vh, 0) scale(1.3) rotate(18deg);
          opacity: 0;
        }
      }

      .knight-card {
        position: relative;
        z-index: 1;
        width: min(92vw, 860px);
        padding: 30px 24px 26px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.46);
        border: 2px solid rgba(255,255,255,0.75);
        box-shadow: 0 18px 36px rgba(255, 118, 177, 0.18);
        text-align: center;
      }

      .knight-image {
        width: min(82vw, 360px);
        height: auto;
        display: block;
        margin: 0 auto 20px;
        border-radius: 24px;
        box-shadow: 0 18px 30px rgba(255, 118, 177, 0.2);
        border: 4px solid rgba(255,255,255,0.7);
      }

      .knight-text {
        margin: 0 auto;
        max-width: 720px;
        font-size: clamp(1.1rem, 2vw, 1.5rem);
        line-height: 1.7;
        color: #7d355f;
      }

      .knight-text strong {
        color: #ff4ea6;
      }

      .final-cta {
        display: inline-block;
        margin-top: 26px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, #ff7ec1 0%, #ff4f9c 42%, #ff7ab8 100%);
        color: white;
        padding: 16px 28px;
        font-size: 1.05rem;
        font-weight: 900;
        letter-spacing: 0.04em;
        cursor: pointer;
        box-shadow: 0 14px 24px rgba(255, 92, 167, 0.28);
      }
    </style>
  </head>
  <body>
    <div class="heart-field" aria-hidden="true"></div>

    <main class="knight-card">
      <img class="knight-image" src="Cavaler.jpg" alt="Knight in shining armor" />

      <p class="knight-text">
        <strong>Consider me your personal knight in shining armor, Monique.</strong>
        Whenever the world gets too heavy or the skies turn grey, I will be right here standing guard,
        ready to shield you from the storm.
      </p>

      <button class="final-cta" type="button">NOW I DO BELIEVE YOU</button>
    </main>

    <script>
      const heartField = document.querySelector('.heart-field');
      const finalBtn = document.querySelector('.final-cta');

      finalBtn.addEventListener('click', () => {
        window.location.href = 'compliments-page.html';
      });

      function createHeart() {
        if (!heartField) return;
        const heart = document.createElement('span');
        const symbols = ['❤', '♥', '♡'];
        heart.className = 'heart';
        heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.animationDuration = `${8 + Math.random() * 7}s`;
        heart.style.fontSize = `${0.9 + Math.random() * 1.7}rem`;
        heart.style.setProperty('--drift', `${(Math.random() - 0.5) * 180}px`);
        heartField.appendChild(heart);
        setTimeout(() => heart.remove(), 15000);
      }

      for (let i = 0; i < 18; i += 1) {
        setTimeout(createHeart, i * 260);
      }

      setInterval(createHeart, 500);
    </script>
  </body>
</html>
