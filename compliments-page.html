<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compliments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        background: linear-gradient(180deg, #fff7f0 0%, #ffe3f1 35%, #ffd4eb 100%);
        min-height: 100vh;
        overflow-x: hidden;
        padding: 28px 0 40px;
      }

      .heart-field {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }

      .heart {
        position: absolute;
        top: -20%;
        font-size: 1.2rem;
        color: rgba(255, 120, 180, 0.9);
        text-shadow: 0 0 12px rgba(255, 164, 212, 0.8);
        animation: floatHeart linear forwards;
        opacity: 0;
      }

      @keyframes floatHeart {
        0% {
          transform: translate3d(0, 0, 0) scale(0.5) rotate(0deg);
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        100% {
          transform: translate3d(var(--drift), 120vh, 0) scale(1.5) rotate(18deg);
          opacity: 0;
        }
      }

      .compliments-shell {
        position: relative;
        z-index: 1;
        width: min(92vw, 900px);
        margin: 0 auto;
        padding: 36px 24px;
        text-align: center;
      }

      .title-burst {
        position: relative;
        display: inline-block;
        margin-bottom: 20px;
        font-size: clamp(2.5rem, 6vw, 6rem);
        font-weight: 900;
        letter-spacing: 0.06em;
        color: #ff4ea6;
        text-shadow: 0 0 18px rgba(255, 122, 184, 0.4);
        animation: titlePulse 1.8s ease-in-out infinite alternate;
      }

      @keyframes titlePulse {
        from {
          transform: scale(0.98) translateY(0);
        }
        to {
          transform: scale(1.03) translateY(-4px);
        }
      }

      .xp-burst {
        position: absolute;
        font-weight: 900;
        color: #ff8fc7;
        text-shadow: 0 0 14px rgba(255, 146, 206, 0.6);
        animation: popXP 1.8s ease-in-out forwards;
        opacity: 0;
      }

      @keyframes popXP {
        0% {
          opacity: 0;
          transform: translate(-50%, 0) scale(0.7);
        }
        15% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -80px) scale(1.2);
        }
      }

      .compliment-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(150px, 1fr));
        gap: 18px;
        margin-top: 32px;
      }

      .compliment-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 74px;
        padding: 16px 18px;
        border: none;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255, 219, 236, 0.82));
        color: #ff4ea6;
        font-size: 1.05rem;
        font-weight: 900;
        letter-spacing: 0.04em;
        box-shadow: 0 12px 24px rgba(255, 120, 180, 0.14);
        cursor: pointer;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }

      .compliment-btn:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 16px 28px rgba(255, 120, 180, 0.2);
      }

      .footer-note {
        margin-top: 28px;
        text-align: center;
        color: #7b335f;
        font-size: clamp(1rem, 1.5vw, 1.3rem);
        font-weight: 800;
        line-height: 1.6;
      }

      .final-btn {
        display: inline-block;
        margin-top: 18px;
        padding: 16px 24px;
        border: none;
        border-radius: 18px;
        background: linear-gradient(135deg, #ff7fc4 0%, #ff4fa1 42%, #ff8ac0 100%);
        color: white;
        font-size: 1.1rem;
        font-weight: 900;
        box-shadow: 0 16px 26px rgba(255, 111, 179, 0.28);
        cursor: pointer;
      }

      @media (max-width: 640px) {
        .compliment-grid {
          grid-template-columns: repeat(2, minmax(130px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="heart-field" aria-hidden="true"></div>

    <main class="compliments-shell">
      <div class="title-burst" id="title">COMPLIMENTS</div>

      <div class="compliment-grid">
        <button class="compliment-btn" type="button" data-page="lips-page.html">Lips</button>
        <button class="compliment-btn" type="button" data-page="eyes-page.html">Eyes</button>
        <button class="compliment-btn" type="button" data-page="personality-page.html">Personality</button>
        <button class="compliment-btn" type="button" data-page="smile-page.html">Smile</button>
        <button class="compliment-btn" type="button" data-page="boobs-page.html">Boobs</button>
        <button class="compliment-btn" type="button" data-page="feet-page.html">MY FAVORITE FEET</button>
      </div>

      <div class="footer-note">
        I am not gonna make the 6-7 joke now.<br />
        Click this button only if you opened all the compliments
      </div>
      <button class="final-btn" type="button">OFC honey!</button>
    </main>

    <script>
      const heartField = document.querySelector('.heart-field');
      const title = document.getElementById('title');

      function createHeart() {
        if (!heartField) return;
        const heart = document.createElement('span');
        const symbols = ['❤', '♥', '♡'];
        heart.className = 'heart';
        heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.animationDuration = `${8 + Math.random() * 7}s`;
        heart.style.fontSize = `${0.9 + Math.random() * 1.8}rem`;
        heart.style.setProperty('--drift', `${(Math.random() - 0.5) * 180}px`);
        heartField.appendChild(heart);
        setTimeout(() => heart.remove(), 15000);
      }

      function spawnBurstText() {
        const burst = document.createElement('div');
        burst.className = 'xp-burst';
        const values = ['+XP', '+LP'];
        burst.textContent = values[Math.floor(Math.random() * values.length)];
        burst.style.left = `${35 + Math.random() * 30}%`;
        burst.style.top = `${25 + Math.random() * 32}%`;
        burst.style.fontSize = `${1.2 + Math.random() * 1.5}rem`;
        title.parentElement.appendChild(burst);
        setTimeout(() => burst.remove(), 1800);
      }

      document.querySelectorAll('.compliment-btn').forEach((button) => {
        button.addEventListener('click', () => {
          const page = button.dataset.page;
          if (page) window.location.href = page;
        });
      });

      const finalBtn = document.querySelector('.final-btn');
      if (finalBtn) {
        finalBtn.addEventListener('click', () => {
          window.location.href = 'calendar-forever.html';
        });
      }

      for (let i = 0; i < 30; i += 1) {
        setTimeout(createHeart, i * 220);
      }

      for (let i = 0; i < 18; i += 1) {
        setTimeout(spawnBurstText, i * 260);
      }

      setInterval(createHeart, 420);
      setInterval(spawnBurstText, 600);
    </script>
  </body>
</html>
