<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hey Moniiiii</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="heart-field" aria-hidden="true"></div>

    <main class="page-shell">
      <section class="message-card" aria-label="Question card">
        <div class="spark spark-one"></div>
        <div class="spark spark-two"></div>
        <div class="spark spark-three"></div>

        <p class="intro">HEYYYY MONIIIIII!!!!!</p>
        <h1>I HAVE A VERY BIG QUESTION..</h1>

        <div class="actions" aria-label="Answer choices">
          <button id="listenBtn" class="listen-btn" type="button">I'M LISTENING</button>
        </div>

        <button id="noBtn" class="no-btn" type="button" aria-label="No">No</button>

        <p id="responseText" class="response" hidden>
          You already had my attention. <span>❤</span>
        </p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
